<div class="container">
  <div class="container-header-small">
    @for (item of navigationList; track $index) {
    @if (router.url.includes(item.route)) {
    <div class="container-header-text">
      <h1>{{item.text.h2}}</h1>
      <p>{{item.text.p}}</p>
    </div>
    }
    }
  </div>


  @if (isCollapsed) {
  <app-route-after-collapse [links]="links"></app-route-after-collapse>
  }

  <main>
    <!-- <app-left-side-navigation-panel
      [navigationList]="navigationList"
    ></app-left-side-navigation-panel> -->
    <section class="mainArea">
      <router-outlet></router-outlet>
    </section>


  </main>

</div>
