<div class="env">
  <header class="env-head">
    <h1>Environnement</h1>
    <p>Les données de référence qui alimentent tous les modules. Ce qui est créé ici apparaît dans les formulaires, les filtres et les règles de l’application.</p>
  </header>

  <div class="env-body">
    <nav class="env-nav" aria-label="Sections de l’environnement">
      @for (g of groups; track g.title) {
      <div class="env-group">
        <span class="env-group-title">{{ g.title }}</span>
        @for (s of g.sections; track s.route) {
        <a class="env-link" [routerLink]="s.route" routerLinkActive="on" ariaCurrentWhenActive="page">
          <ng-icon [name]="s.icon" aria-hidden="true" />
          <span class="env-link-text">
            <strong>{{ s.label }}</strong>
            <small>{{ s.description }}</small>
          </span>
        </a>
        }
      </div>
      }
    </nav>

    <section class="env-main">
      <router-outlet />
    </section>
  </div>
</div>
