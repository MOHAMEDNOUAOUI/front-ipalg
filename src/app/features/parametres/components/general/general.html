<div class="container">
    <div class="general-row">
        <div class="general-row-text">
            <h4>Apparence</h4>
            <p>Choisissez le thème clair ou sombre de l’application</p>
        </div>
        <app-costume-select (emitOption)="catchOption($event)" [selectedOptionInput]="this.AppStore.appearance()"
            [options]="appearances"></app-costume-select>
    </div>
    <div class="general-row">
        <div class="general-row-text">
            <h4>Langue</h4>
            <p>Langue d’affichage de l’interface</p>
        </div>
        <app-costume-select (emitOption)="catchOption($event)" [selectedOptionInput]="this.AppStore.langue()"
            [options]="languages"></app-costume-select>
    </div>
</div>
