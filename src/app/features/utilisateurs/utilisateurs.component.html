<div class="page">
    <header class="head">
        <div>
            <h1>Utilisateurs</h1>
            <p>Comptes, profils et accès à l’application</p>
        </div>
    </header>

    <div class="sheet">
        <app-generic-table [header]="true" (actionEvent)="actionsDistributor($event)" [ellipsisItems]="items"
            [buttons]="buttons" [store]="userStore" [icon]="'pi-spinner'" [page]="'utilisateur'"></app-generic-table>
    </div>
</div>

@if (userCreatePopUp) {
<app-utilisateur-create (cancel)="this.userCreatePopUp = false"></app-utilisateur-create>
}
