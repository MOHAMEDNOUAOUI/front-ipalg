<div class="container">
    <div class="container-header-small">
        <div class="container-header-text">
            <h1>Gestion des utilisateurs</h1>
            <p>Gérez vos utilisateurs</p>
        </div>
        <div class="container-header-filter-container">

        </div>
    </div>
    <app-table-users [store]="userStore" (exporterEmit)="exporterUtilisateurs()" [exporter]="true" [importer]="true"
        (Ajouter)="takeAjouterResponse($event)" (Modifier)="takeModifierResponse($event)"
        (supprimer)="takeDeleteResponse($event)" (filter)="takeFilterResponse($event)" [modifier]="true" [delete]="true"
        [ellipsis]="true" [icon]="'pi-spinner'" [page]="'utilisateur'" [columns]="columns"></app-table-users>

</div>


@if (userCreatePopUp) {
<app-utilisateur-create (cancel)="this.userCreatePopUp = false"></app-utilisateur-create>
}
