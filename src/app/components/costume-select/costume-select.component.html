<div class="dropdown" (click)="toggleDropdown()" tabindex="0" (blur)="closeDropdown()">
    <div class="selectedContainer" [ngStyle]="{ 'borderColor': dropdownOpen ? 'var(--color-primary)' : '' }">
        {{ selectedOption }}
    </div>

    @if (dropdownOpen) {
    <ul class="options">
        @for (option of options; track $index) {
        <li [ngClass]="{ 'selected': option === selectedOption }" (click)="selectOption(option)">
            {{ option! }}
            @if(option === selectedOption){
            <i class="pi pi-check"></i>
            }
        </li>
        }

    </ul>
    }

</div>
