<div [ngClass]="{
    'p-button': true,
    'p-button-text': variant === Variant.text,
    'p-button-outlined': outline,
    'p-button-rounded': rounded,
    'p-button-secondary': severity === Severity.Secondary,
    'p-button-success': severity === Severity.Success,
    'p-button-warn': severity === Severity.Warn,
    'p-button-help': severity === Severity.Help,
    'p-button-danger': severity === Severity.Danger,
    'p-button-dark': severity === Severity.Dark
  }">
  <i *ngIf="icon" [classList]="'pi '+ icon"></i>
  <p>{{ label }}</p>
</div>
